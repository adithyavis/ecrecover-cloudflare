[package]
name = "ecrecover-cloudflare"
version = "0.1.0"
edition = "2021"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alloy-primitives = { version = "1.6", default-features = false, features = ["k256", "serde"] }
alloy-consensus = { version = "2.4", default-features = false, features = ["k256", "serde"] }
alloy-rlp = { version = "0.3", default-features = false }
alloy-eips = { version = "2.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.8"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
alloy-signer = "2.4"
alloy-signer-local = "2.4"

[profile.release]
lto = true
strip = false
codegen-units = 1
opt-level = 3
